version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    labels:
      - chore
    commit-message:
      prefix: chore
      include: scope
    # Minor and patch updates come in one PR. Majors come one by one, since
    # they are the ones that break things.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    labels:
      - chore
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - '*'
