name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A new push to a PR cancels its previous run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: Type check, lint, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history, so the lint step can diff against the base branch.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund

      # Each check runs even if the one before failed, so a single run shows
      # every problem. The job still fails if any of them fails.
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      # Only the files the PR changes, as the engineering guidelines ask, while
      # the Fastify-era code still fails lint.
      # TODO(#27): switch to `npm run lint` once #27 and #31 replace that code.
      - name: Lint changed files
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/$BASE...HEAD" | grep -E '\.(ts|tsx|js)$' || true)
          if [ -z "$files" ]; then
            echo "No changed files to lint."
            exit 0
          fi
          echo "$files" | xargs -d '\n' npx eslint

      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
