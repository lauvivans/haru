# Cuts release/<version> from develop and opens the pull request to main.
# See docs/decisions/003-release-flow.md.
name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z). Leave empty to compute it from the commits.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Cut the release branch and open the pull request
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history and tags, for the version rule.
          fetch-depth: 0

      # Highest v* tag by version, not git describe: the tag sits on the merge
      # commit in main, which develop only reaches after a merge back.
      - name: Compute the version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          range=${last:+$last..}HEAD

          if [ -z "$(git log --format=%H "$range")" ]; then
            echo "::error::No commits since $last."
            exit 1
          fi

          if [ -n "$INPUT" ]; then
            version=$INPUT
          elif [ -z "$last" ]; then
            version=0.1.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            subjects=$(git log --format=%s "$range")
            if grep -qE '^[a-z]+(\([^)]*\))?!:' <<< "$subjects" ||
              git log --format=%B "$range" | grep -qE '^BREAKING[ -]CHANGE:'; then
              # In 0.x a breaking change bumps the minor.
              if [ "$major" -eq 0 ]; then
                minor=$((minor + 1))
              else
                major=$((major + 1))
                minor=0
              fi
              patch=0
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$subjects"; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi
            version=$major.$minor.$patch
          fi

          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z, got '$version'."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "release/$version" > /dev/null; then
            echo "::error::Branch release/$version already exists."
            exit 1
          fi

          echo "Version $version (last tag: ${last:-none})."
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Push the branch and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RANGE: ${{ steps.version.outputs.range }}
        run: |
          # Every issue a commit closes, so the merge into main closes them.
          issues=$(git log --format=%B "$RANGE" |
            grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' |
            grep -oE '[0-9]+' | sort -nu)

          {
            echo "Release $VERSION, cut from \`develop\` by the Cut release workflow."
            echo
            echo "Merge with a merge commit (never squash). The merge runs the release workflow: CI, then the tag \`v$VERSION\`, the GitHub release and the production deploy."
            if [ -n "$issues" ]; then
              echo
              for n in $issues; do echo "Closes #$n"; done
            fi
          } > "$RUNNER_TEMP/body.md"

          git push origin "HEAD:refs/heads/release/$VERSION"
          gh pr create --base main --head "release/$VERSION" \
            --title "chore(release): $VERSION" --body-file "$RUNNER_TEMP/body.md"
