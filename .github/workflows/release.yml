# Runs when a pull request from release/<version> is merged into main: CI,
# then the tag, the GitHub release and the production deploy.
# See docs/decisions/003-release-flow.md.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Read the version from the branch name
    if: github.event.pull_request.merged && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check the branch name
        id: version
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          version=${BRANCH#release/}
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$BRANCH is not release/X.Y.Z."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  release:
    name: Tag and publish the GitHub release
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "$TAG" --generate-notes

  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ref: ${{ github.event.pull_request.merge_commit_sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
