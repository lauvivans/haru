# Deploys one environment. Called by staging.yml (push to develop) and
# production.yml (push to main).
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production.
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # One deploy per environment at a time. The next one waits instead of
    # cancelling a deploy halfway.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check the environment
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$ENVIRONMENT" != staging ] && [ "$ENVIRONMENT" != production ]; then
            echo "::error::Unknown environment: $ENVIRONMENT"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The Vite plugin picks the environment at build time, so the deploy
      # takes no --env. Empty means production, the top level of wrangler.jsonc.
      - name: Build
        env:
          CLOUDFLARE_ENV: ${{ inputs.environment == 'staging' && 'staging' || '' }}
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy
